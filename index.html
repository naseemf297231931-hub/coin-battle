
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Battle</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090d1b;color:white;
 font-family:Arial,sans-serif;text-align:center;
}
header{padding:24px 12px;background:#151d35}
h1{color:#ffd34e;font-size:32px;margin:5px}
.subtitle{color:#aeb9d4}
.container{max-width:430px;margin:auto;padding:20px}
.card{
 background:#151d35;border:1px solid #293657;
 border-radius:18px;padding:20px;margin:16px 0;
}
.players{display:flex;justify-content:space-around;gap:12px}
.player{
 flex:1;background:#202b49;padding:16px 5px;
 border-radius:14px;
}
.avatar{font-size:35px}
.coins{color:#ffd34e;font-weight:bold}
button{
 border:0;border-radius:12px;padding:14px 20px;
 font-size:16px;font-weight:bold;cursor:pointer;
}
.play{background:#ffd34e;color:#171717;width:100%;margin:12px 0}
.choice{background:#293657;color:white;margin:6px}
.choice.selected{background:#ffd34e;color:#111}
button:disabled{opacity:.5}
.coin{
 font-size:85px;margin:20px;
 display:inline-block;
}
.flip{animation:spin 1s ease-in-out}
@keyframes spin{
 0%{transform:rotateY(0)}
 100%{transform:rotateY(1080deg)}
}
#status{color:#ffd34e;min-height:30px;font-weight:bold}
.score{font-size:30px;color:#ffd34e}
.small{font-size:12px;color:#9ca9c9}
</style>
</head>
<body>

<header>
 <h1>🪙 COIN BATTLE</h1>
 <div class="subtitle">FIND YOUR OPPONENT • FLIP • WIN</div>
</header>

<div class="container">

 <div class="card">
  <div class="players">
   <div class="player">
    <div class="avatar">👤</div>
    <b>YOU</b>
    <p class="coins">⭐ <span id="myPoints">0</span></p>
   </div>
   <div class="player">
    <div class="avatar">🤖</div>
    <b>OPPONENT</b>
    <p class="coins">⭐ <span id="opPoints">0</span></p>
   </div>
  </div>
 </div>

 <div class="card">
  <h2>Choose Your Side</h2>
  <button class="choice" id="heads" onclick="choose('HEADS')">🟡 HEADS</button>
  <button class="choice" id="tails" onclick="choose('TAILS')">⚪ TAILS</button>
  <div id="coin" class="coin">🪙</div>
  <div id="status">Select HEADS or TAILS</div>
  <button class="play" id="play" onclick="playGame()" disabled>
   PLAY NOW
  </button>
 </div>

 <div class="card">
  <h3>🏆 Your Score</h3>
  <div class="score" id="score">0 - 0</div>
  <p class="small">One point for every win</p>
  <button class="choice" onclick="resetGame()">RESET SCORE</button>
 </div>

 <p class="small">
  Demo version • Practice points only • No real money
 </p>
</div>

<script>
let selected = "";
let myPoints = 0;
let opPoints = 0;
let busy = false;

function choose(side){
 if(busy) return;
 selected = side;
 document.getElementById("heads").classList.toggle("selected",side==="HEADS");
 document.getElementById("tails").classList.toggle("selected",side==="TAILS");
 document.getElementById("play").disabled = false;
 document.getElementById("status").innerText = "You selected "+side;
}

function playGame(){
 if(!selected || busy) return;
 busy = true;
 document.getElementById("play").disabled = true;
 document.getElementById("heads").disabled = true;
 document.getElementById("tails").disabled = true;

 document.getElementById("status").innerText = "Finding opponent...";
 setTimeout(()=>{
  document.getElementById("status").innerText = "Opponent found! Flipping coin...";
  const coin = document.getElementById("coin");
  coin.classList.remove("flip");
  void coin.offsetWidth;
  coin.classList.add("flip");

  setTimeout(()=>{
   const result = Math.random()<0.5 ? "HEADS":"TAILS";
   coin.innerText = result==="HEADS" ? "🟡":"⚪";

   if(selected===result){
    myPoints++;
    document.getElementById("status").innerText = "🎉 YOU WIN! "+result;
   }else{
    opPoints++;
    document.getElementById("status").innerText = "Opponent wins! "+result;
   }

   updateScore();
   busy = false;
   document.getElementById("heads").disabled = false;
   document.getElementById("tails").disabled = false;
   document.getElementById("play").innerText = "PLAY AGAIN";
  },1100);
 },1000);
}

function updateScore(){
 document.getElementById("myPoints").innerText=myPoints;
 document.getElementById("opPoints").innerText=opPoints;
 document.getElementById("score").innerText=myPoints+" - "+opPoints;
}

function resetGame(){
 if(busy)return;
 myPoints=0;
 opPoints=0;
 selected="";
 document.getElementById("coin").innerText="🪙";
 document.getElementById("status").innerText="Select HEADS or TAILS";
 document.getElementById("play").innerText="PLAY NOW";
 document.getElementById("play").disabled=true;
 document.getElementById("heads").classList.remove("selected");
 document.getElementById("tails").classList.remove("selected");
 updateScore();
}
</script>
</body>
  </html>
